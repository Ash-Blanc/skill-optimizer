[project]
name = "skill-optimizer"
version = "0.1.0"
description = "Optimize agent skills using DSPy teleprompters"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agno>=2.4.2",
    "dspy-ai>=3.1.2",
    "langwatch>=0.10.0",
    "openai>=2.15.0",
    "openinference-instrumentation-agno>=0.1.26",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.26.0",
    "rich>=14.2.0",
    "typer>=0.21.0",
    "python-dotenv>=1.0.0",
    "python-frontmatter>=1.1.0",
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "mistralai>=1.10.1",
    "SQLAlchemy>=2.0.46",
    "optuna>=4.7.0",
    "langwatch-scenario>=0.7.26",
]

[project.scripts]
skill-optimizer = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

